version: "3.9"

services:
  backend:
    build:
      context: ./wcmvpvs-back
      dockerfile: Dockerfile
    image: wcmvpvs-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CFG_WEB_APIHOST: 0.0.0.0:3000
      CFG_DB_FILENAME: /data/mvpvs.db
      CFG_VOTE_SECRET: ${VOTE_SECRET:-secret}
      CFG_BOOTSTRAPADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-true}
      CFG_BOOTSTRAPADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-Albyma}
      CFG_BOOTSTRAPADMIN_PASSWORDHASH: ${BOOTSTRAP_ADMIN_PASSWORD_HASH:-4bdbc215d8dc3c571e802a69bced0c3071cc4a1f129ad97e15b357018aac6cd4}
      CFG_BOOTSTRAPADMIN_ROLE: ${BOOTSTRAP_ADMIN_ROLE:-superadmin}
      CFG_AI_ENABLED: ${CFG_AI_ENABLED:-false}
      CFG_AI_REQUESTTIMEOUT: ${CFG_AI_REQUESTTIMEOUT:-4s}
      CFG_AI_CACHETTL: ${CFG_AI_CACHETTL:-90s}
      CFG_AI_MAXPOPUPSSESSION: ${CFG_AI_MAXPOPUPSSESSION:-3}
      CFG_AI_POPUPCOOLDOWN: ${CFG_AI_POPUPCOOLDOWN:-8m}
      AI_PROVIDER_BASE_URL: ${AI_PROVIDER_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    volumes:
      - backend-data:/data
    expose:
      - "3000"
    # Se vuoi debuggare direttamente l'API dall'host, aggiungi:
    # ports:
    #   - "3000:3000"

  frontend:
    build:
      context: ./wcmvpvs-front
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    image: wcmvpvs-frontend:latest
    depends_on:
      - backend
    restart: unless-stopped
    expose:
      - "80"
  caddy:
    image: caddy:2.8-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  backend-data:
  caddy-data:
  caddy-config:
